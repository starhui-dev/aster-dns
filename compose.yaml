name: aster-dns

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aster_dns}
      POSTGRES_USER: ${POSTGRES_USER:-aster_dns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    image: aster-dns:local
    build:
      context: .
    command: ["migrate", "up"]
    environment:
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-aster_dns}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-aster_dns}?sslmode=${POSTGRES_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: aster-dns:local
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LISTEN_ADDR: :8080
      APP_PUBLIC_URL: ${APP_COMPOSE_PUBLIC_URL:-http://localhost:8080}
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-aster_dns}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-aster_dns}?sslmode=${POSTGRES_SSLMODE:-disable}
      APP_MASTER_KEY: ${APP_MASTER_KEY-}
      APP_MASTER_KEY_FILE: ${APP_MASTER_KEY_FILE-}
      APP_MASTER_KEY_VERSION: ${APP_MASTER_KEY_VERSION:-1}
      APP_PREVIOUS_MASTER_KEYS: ${APP_PREVIOUS_MASTER_KEYS:-}
      APP_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN-}
      APP_PASSWORD_LOGIN_ENABLED: ${APP_PASSWORD_LOGIN_ENABLED:-false}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_DB_MAX_CONNS: ${APP_DB_MAX_CONNS:-10}
      APP_DB_MIN_CONNS: ${APP_DB_MIN_CONNS:-1}
      APP_DB_CONNECT_TIMEOUT: ${APP_DB_CONNECT_TIMEOUT:-5s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
      APP_HTTP_READ_HEADER_TIMEOUT: ${APP_HTTP_READ_HEADER_TIMEOUT:-5s}
      APP_HTTP_READ_TIMEOUT: ${APP_HTTP_READ_TIMEOUT:-15s}
      APP_HTTP_WRITE_TIMEOUT: ${APP_HTTP_WRITE_TIMEOUT:-30s}
      APP_HTTP_IDLE_TIMEOUT: ${APP_HTTP_IDLE_TIMEOUT:-2m}
      APP_HTTP_MAX_HEADER_BYTES: ${APP_HTTP_MAX_HEADER_BYTES:-1048576}
      APP_READY_TIMEOUT: ${APP_READY_TIMEOUT:-2s}
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-}
      APP_ZONE_SYNC_INTERVAL: ${APP_ZONE_SYNC_INTERVAL:-15m}
      APP_AUTH_SESSION_IDLE_TTL: ${APP_AUTH_SESSION_IDLE_TTL:-30m}
      APP_AUTH_SESSION_ABSOLUTE_TTL: ${APP_AUTH_SESSION_ABSOLUTE_TTL:-24h}
      APP_AUTH_SESSION_REFRESH_INTERVAL: ${APP_AUTH_SESSION_REFRESH_INTERVAL:-1m}
      APP_AUTH_CHALLENGE_TTL: ${APP_AUTH_CHALLENGE_TTL:-5m}
      APP_AUTH_ENROLLMENT_TTL: ${APP_AUTH_ENROLLMENT_TTL:-24h}
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck", "--url", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  postgres-data:
