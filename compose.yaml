name: aster-dns

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aster_dns}
      POSTGRES_USER: ${POSTGRES_USER:-aster_dns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    image: aster-dns:local
    build:
      context: .
    command: ["migrate", "up"]
    environment:
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-aster_dns}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-aster_dns}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: aster-dns:local
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LISTEN_ADDR: :8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-aster_dns}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-aster_dns}?sslmode=disable
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_DB_MAX_CONNS: ${APP_DB_MAX_CONNS:-10}
      APP_DB_MIN_CONNS: ${APP_DB_MIN_CONNS:-1}
      APP_DB_CONNECT_TIMEOUT: ${APP_DB_CONNECT_TIMEOUT:-5s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  postgres-data:
